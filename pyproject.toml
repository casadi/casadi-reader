[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "casadi-reader"
version = "0.0.0a0"
description = "Experimental standalone reader for CasADi serialized MX functions and resources"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*.txt"]
dependencies = []

[project.scripts]
casadi-reader = "casadi_reader.__main__:main"

[tool.setuptools.packages.find]
where = ["python"]
include = ["casadi_reader*"]
