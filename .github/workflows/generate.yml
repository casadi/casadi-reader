name: Generate and validate readers
on:
  push:
    branches: [generate]
  pull_request:
    branches: [generate]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: generate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  npm:
    uses: ./.github/workflows/reader.yml
  bindings:
    uses: ./.github/workflows/bindings.yml
  update-main:
    needs: [npm, bindings]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/generate'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          name: julia-fixtures
          path: julia/test/fixtures
      - id: snapshot
        run: python scripts/update-generated-branch.py --push
      # Coverage describes generated files, which are tracked only on main.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.snapshot.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: julia-coverage
          path: coverage
      - uses: codecov/codecov-action@v5
        with:
          files: coverage/julia.lcov
          disable_search: true
          flags: julia
          use_oidc: true
          override_commit: ${{ steps.snapshot.outputs.commit }}
          override_branch: main
