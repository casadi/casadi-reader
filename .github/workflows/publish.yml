name: Publish language packages
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  registered:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check-version.py
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Require matching Julia registration in General
        run: python scripts/check-julia-registration.py
  publish:
    needs: bindings
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --global npm@11
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=commonjs -e 'if (process.env.RELEASE_TAG !== "v" + require("./package.json").version) throw Error("Release tag must match package.json version")'
      - run: python scripts/check-version.py
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: npm ci
      - run: npm run check:generated
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Publish with OIDC and provenance
        run: |
          reader_dist_tag=$(node --input-type=commonjs -p 'require("./package.json").version.includes("-") ? "next" : "latest"')
          npm publish --access public --provenance --tag "$reader_dist_tag"
  bindings:
    needs: registered
    uses: ./.github/workflows/bindings.yml
  publish-python:
    needs: bindings
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/casadi-reader
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
  release-assets:
    needs: bindings
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: source-packages
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: artifacts
      - name: Attach tested language packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum artifacts/* > artifacts/SHA256SUMS
          gh release upload "$RELEASE_TAG" artifacts/*
