name: Reader assets and packages
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Check before build regenerates assets, so stale committed output fails CI.
      - run: npm run check:generated
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/native --parallel 2
      - run: ctest --test-dir build/native --output-on-failure
      - run: python -m unittest discover -s python/tests -v
        env:
          PYTHONPATH: python
          CASADI_READER_NATIVE: ${{ github.workspace }}/build/native/casadi-reader-native
      - run: python -m pip install build twine
      - run: python -m build --outdir artifacts
      - run: python -m twine check artifacts/*
      - run: npm pack --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: reader-packages
          path: artifacts/
